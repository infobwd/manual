<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174f47"><title>คลังผลงานวิชาการ | WD Books</title>
<style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#173a35;background:#f5f7f4;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#174f47;color:white;padding:12px max(16px,calc((100vw - 960px)/2));}a{color:#17695d}header a{color:white}main{max-width:960px;margin:auto;padding:20px 16px 90px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}input,select,button{font:inherit;border:1px solid #b7c8c1;border-radius:12px;padding:12px;background:white;color:inherit}input{flex:2;min-width:190px}select{flex:1;min-width:140px}button{cursor:pointer}.card details{margin-top:12px;border-top:1px solid #dce7e0;padding-top:12px}.card summary{cursor:pointer;font-weight:600;color:#17695d}.card h2{font-size:1.22rem;line-height:1.5;margin:4px 0 10px;overflow-wrap:anywhere}header h1{margin:12px 0 4px;font-size:1.55rem}header p{margin:0 0 4px;font-size:.92rem;line-height:1.5}.card{background:white;border:1px solid #d7e2db;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #102c2210}.meta{color:#586e65;font-size:.88em}.pill{display:inline-block;border-radius:30px;background:#e6f0ec;padding:5px 10px;font-size:.8em;margin:4px 4px 4px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.empty{padding:26px;text-align:center}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:.86em}body.dark{background:#13201d;color:#e8f2ec}body.dark .card{background:#1e302a;border-color:#365148}body.dark .meta{color:#b3c7bd}body.dark input,body.dark select,body.dark button{background:#223b32;color:#fff;border-color:#537266}body.dark a{color:#9bdfce}body.dark header a{color:white}@media(max-width:560px){h1{font-size:1.5rem}.toolbar>*{width:100%;flex:auto}}
</style></head><body><header><div class="top"><a href="./index.html">← กลับชั้นหนังสือ</a><span>WD Books · Research Library</span></div><h1>คลังผลงานวิชาการ</h1><p>ค้นคว้างานวิจัยและเอกสารอ้างอิงสำหรับการพัฒนาสถานศึกษา</p></header>
<main><p><a href="./research-guide.html" style="display:inline-block;padding:12px 14px;border:1px solid #b7c8c1;border-radius:12px">📖 อ่านคู่มือวิเคราะห์เปรียบเทียบงานวิจัยกับ WD Growth Together ↗</a></p><div class="top"><p id="count" role="status">กำลังโหลดข้อมูล…</p><div><button id="font" aria-label="ปรับขนาดตัวอักษร">ก− / ก+</button> <button id="theme">ถนอมสายตา</button></div></div>
<div class="toolbar"><input id="query" type="search" aria-label="ค้นหาผลงาน" placeholder="ค้นหาชื่อเรื่อง ผู้เขียน หรือ PLC"><select id="type" aria-label="ประเภทเอกสาร"><option value="">ทุกประเภท</option><option value="research_article">บทความวิจัย</option><option value="academic_article">บทความวิชาการ</option><option value="principal_expert_case">รายชื่อผู้ผ่านเชี่ยวชาญ (รอตรวจประกาศ)</option></select><select id="level" aria-label="ระดับหลักฐาน"><option value="">ทุกสถานะ</option><option value="A">A: ยืนยันฉบับเต็ม</option><option value="B">B: มีบางส่วน</option><option value="C">C: มีประกาศอนุมัติ</option><option value="D">D: ยังไม่ยืนยันผ่าน</option></select><label style="display:flex;align-items:center;gap:8px"><input id="onlyFavorites" type="checkbox" style="flex:none;min-width:auto"> ชั้นของฉัน</label></div>
<p class="small meta">ข้อมูลระยะเริ่มต้น · ลิงก์ที่ยังไม่ตรวจสอบจะแสดงตามจริง · ไม่ถือว่าบทความทั่วไปผ่านวิทยฐานะแล้ว</p><section id="results" aria-label="รายการผลงาน"></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),store='wd-research-library';let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const favKey='wd-research-favorites-v1';let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem(favKey)||'[]'))}catch{}const levels={A:'ยืนยันอนุมัติและฉบับเต็ม',B:'อนุมัติและมีบางส่วน',C:'มีรายชื่อในข่าว — รอตรวจประกาศต้นฉบับ',D:'ยังไม่ยืนยันว่าผ่านวิทยฐานะ'};function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}}function draw(){const q=$('query').value.trim().toLocaleLowerCase('th'),t=$('type').value,l=$('level').value;const filtered=rows.filter(r=>(!t||r.document_type===t)&&(!l||r.verification_level===l)&&(!$('onlyFavorites').checked||favorites.has(r.id))&&[r.title,...(r.authors||[]),...(r.topics||[])].join(' ').toLocaleLowerCase('th').includes(q));$('count').textContent='พบ '+filtered.length+' จาก '+rows.length+' รายการ';$('results').innerHTML=filtered.length?filtered.map(r=>{const u=safeUrl(r.source_page_url),pdf=safeUrl(r.pdf_url),z=r.research_detail;const details=z?'<details><summary>อ่านสรุปงานวิจัยและการนำไปใช้</summary><p class="meta">' + (z.page_citation_status === 'verified_for_listed_claims' ? 'ตรวจจาก PDF ฉบับเต็มแล้ว; เลขหน้าวารสาร: วัตถุประสงค์ 1131/1133, วิธีวิจัยและเครื่องมือ 1136–1137, ผลวิจัย 1138–1139' : 'สรุปจากบทคัดย่อ; ยังไม่ตรวจเลขหน้าใน PDF') + '</p>'+[['วัตถุประสงค์',z.objective],['วิธีวิจัยและกลุ่มตัวอย่าง',z.method],['เครื่องมือ',z.instruments],['ผลการวิจัย',z.findings],['ประโยชน์ต่อ WD Growth Together',z.wd_relevance]].map(([k,v])=>'<p><strong>'+esc(k)+'</strong><br>'+esc(v)+'</p>').join('')+'</details>':'';return '<article class="card"><h2>'+esc(r.title)+'</h2><p class="meta">'+esc((r.authors||[]).join(', '))+'</p><span class="pill">'+esc(r.document_type==='research_article'?'บทความวิจัย':r.document_type==='principal_expert_case'?'ข้อมูลผู้ผ่าน (รอยืนยันต้นฉบับ)':'บทความวิชาการ')+'</span><span class="pill">'+esc(levels[r.verification_level]||'รอตรวจสอบ')+'</span><p class="meta">สถานะลิงก์: '+esc(r.link_status==='verified'?'ตรวจแล้ว':'ยังไม่ยืนยัน')+'</p><div class="actions">'+(u?'<a target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">เปิดแหล่งต้นฉบับ ↗</a>':'<span>ไม่มีลิงก์ที่เปิดได้</span>')+(pdf?'<a target="_blank" rel="noopener noreferrer" href="'+esc(pdf)+'">อ่าน PDF ฉบับเต็ม ↗</a>':'')+'</div>'+details+'</article>'}).join(''):'<p class="empty">ไม่พบรายการที่ตรงกับคำค้น</p>'}$('results').addEventListener('click',e=>{const b=e.target.closest('button[data-favorite]');if(!b)return;const id=b.dataset.favorite;if(favorites.has(id))favorites.delete(id);else favorites.add(id);try{localStorage.setItem(favKey,JSON.stringify([...favorites]))}catch{}draw()});['query','type','level','onlyFavorites'].forEach(id=>$(id).addEventListener('input',draw));try{const s=JSON.parse(localStorage.getItem(store)||'{}');if(s.dark)document.body.classList.add('dark');if(s.font)document.documentElement.style.fontSize=s.font+'px'}catch{}$('theme').onclick=()=>{document.body.classList.toggle('dark');save()};$('font').onclick=()=>{const root=document.documentElement;root.style.fontSize=(parseInt(root.style.fontSize||'16',10)>=20?16:parseInt(root.style.fontSize||'16',10)+2)+'px';save()};function save(){try{localStorage.setItem(store,JSON.stringify({dark:document.body.classList.contains('dark'),font:parseInt(document.documentElement.style.fontSize||'16',10)}))}catch{}}fetch('./docs/principal-expert/data/research-library.seed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{rows=Array.isArray(d.records)?d.records:[];draw()}).catch(()=>{$('count').textContent='ไม่สามารถโหลดฐานข้อมูล';$('results').innerHTML='<p class="empty">โปรดลองใหม่เมื่อเชื่อมต่ออินเทอร์เน็ต</p>'})})();
</script></body></html>
