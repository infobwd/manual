["เริ่มต้น: เมื่อ AI เข้ามาในโรงเรียนแล้ว",["คำถามสำคัญไม่ใช่เพียงว่า AI ตอบได้หรือไม่ แต่คือเด็กได้เรียนรู้อะไรด้วยตนเอง","หนังสือฉบับตัวอย่างนี้จัดเพื่อทดลองการอ่าน ไม่ใช่นโยบายทางการหรือคู่มือที่ตรวจรับครบแล้ว"],["ครูยังรับผิดชอบการออกแบบการเรียนรู้และการตรวจสอบความถูกต้อง","เด็กต้องมีโอกาสคิด อธิบาย ตรวจ และนำความรู้ไปใช้เอง"],"อ่านเพื่อทดลอง UX และส่งข้อเสนอแก้ไขก่อนเผยแพร่จริง"],

["ตัวอย่างใบงาน",["ป.3: ห้องสมุดมีหนังสือ 245 เล่ม ได้เพิ่ม 138 เล่ม และนำไปจัดมุมอ่าน 96 เล่ม","ให้เด็กคิดเองก่อน แล้วตรวจคำตอบจำลองที่ครูเตรียม"],["แสดงขั้นตอนคำนวณ","อธิบายจุดที่สงสัยและทำโจทย์ใหม่"],"ไม่แสดงเฉลยก่อนเด็กลงมือทำ"],
["อบรมครู 180 นาที",["อบรม 6 ช่วง: เปิดประเด็น จริยธรรม ออกแบบใบงาน ตรวจข้อมูล ประเมิน และ PLC","ให้ครูผลิตใบงานหนึ่งชิ้นและแผนทดลองสอน"],["20 + 30 + 40 + 30 + 40 + 20 = 180 นาที","ต้องซ้อมเวลาและแยกเอกสารเฉลยก่อนจัดจริง"],"แผนอบรมยังรอการซ้อมและตรวจรับ"],
["ทบทวนและก้าวต่อไป",["ใช้ AI อย่างรับผิดชอบ โดยให้เด็กยังเป็นเจ้าของการเรียนรู้","ก่อนเผยแพร่ฉบับจริง ต้องตรวจเนื้อหา อ้างอิง ความเป็นส่วนตัว และการอ่านบนอุปกรณ์"],["ตรวจรับโดยครูและผู้ดูแลข้อมูล","ทดสอบ Preview ก่อนอนุมัติลงทะเบียนหนังสือจริง"],"Preview นี้ไม่เชื่อมกับชั้นหนังสือหลักและไม่แก้ข้อมูลการอ่านต่อ"]
];
let page=0,size=16;const $=id=>document.getElementById(id);
function el(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function render(){const item=chapters[page];$("kicker").textContent="AI & SCHOOL TODAY  /  "+String(page+1).padStart(2,"0");$("heading").textContent=item[0];const area=$("content");area.replaceChildren();for(const p of item[1])area.append(el("p",p));const ul=el("ul","");for(const b of item[2])ul.append(el("li",b));area.append(ul);const tip=el("p",item[3]);tip.className="tip";area.append(tip);$("counter").textContent=(page+1)+" / "+chapters.length;$("prev").disabled=page===0;$("next").disabled=page===chapters.length-1;$("tocItems").replaceChildren(...chapters.map((c,i)=>{const b=el("button",(i+1)+". "+c[0]);if(i===page)b.setAttribute("aria-current","page");b.addEventListener("click",()=>go(i));return b}));}
function go(i){page=Math.max(0,Math.min(chapters.length-1,i));render();$("toc").classList.remove("open");$("menu").setAttribute("aria-expanded","false");window.scrollTo({top:0,behavior:"instant"})}
$("prev").addEventListener("click",()=>go(page-1));$("next").addEventListener("click",()=>go(page+1));
$("menu").addEventListener("click",()=>{const open=$("toc").classList.toggle("open");$("menu").setAttribute("aria-expanded",String(open))});
$("smaller").addEventListener("click",()=>{size=Math.max(14,size-2);document.querySelector(".reader").style.fontSize=size+"px"});
$("larger").addEventListener("click",()=>{size=Math.min(26,size+2);document.querySelector(".reader").style.fontSize=size+"px"});
$("theme").addEventListener("click",()=>{const night=document.body.classList.toggle("night");$("theme").textContent=night?"โหมดสว่าง":"โหมดกลางคืน"});
document.addEventListener("keydown",e=>{if(e.target.closest("button,input,textarea"))return;if(e.key==="ArrowRight")go(page+1);if(e.key==="ArrowLeft")go(page-1)});
render();
</script>
